<style>
/* Layout: one black screening room. A 16:9 stage centred, a thin transport bar beneath it. */
:root{

[hidden]{display:none!important}
body{background:var(--room);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;

#stage{position:relative;width:min(100%,calc((100vh - 110px)*16/9));max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;--u:10px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.cap.on{opacity:1;transform:scale(1)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.1);opacity:0;transition:opacity .7s ease;pointer-events:none;text-align:center}
#title.on{opacity:1}
#title h1{margin:0;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*8.2);line-height:1;letter-spacing:.5em;padding-left:.5em;transition:letter-spacing 2.4s cubic-bezier(.2,.7,.2,1),padding-left 2.4s cubic-bezier(.2,.7,.2,1);

  background:rgba(7,9,12,.55);border:1px solid var(--gold);cursor:pointer;backdrop-filter:blur(6px);transition:background .2s,color .2s}
#play:hover{background:var(--gold);color:var(--room)}
#play:focus-visible,#snd:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#bar{width:min(100%,calc((100vh - 110px)*16/9));display:flex;align-items:center;gap:14px;font-size:15px;letter-spacing:.08em;color:var(--dim)}
#track{flex:1;min-width:0;height:2px;background:var(--line);position:relative}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold)}
#tc{font-variant-numeric:tabular-nums;color:var(--ink)}
